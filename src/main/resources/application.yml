server:
  port: 80
spring:
  application:
    name: notice

notice:
  enabled: ${NOTICE_ENABLED:true}
  cron-field: ${NOTICE_CRON_FIELD:corn}
  data-field: ${NOTICE_DATA_FIELD:data}
  on-change-only: ${NOTICE_ON_CHANGE_ONLY:true}
  max-content-length: ${NOTICE_MAX_CONTENT_LENGTH:3000}

github:
  token: ${GITHUB_TOKEN:}
  api-url: ${GITHUB_API_URL:}
  file-path: ${GITHUB_FILE_PATH:/notice/notice.json}
  ref: ${GITHUB_REF:master}
  accept: ${GITHUB_ACCEPT:application/vnd.github+json}
  api-version: ${GITHUB_API_VERSION:2022-11-28}
  timeout-ms: ${GITHUB_TIMEOUT_MS:10000}

wecom:
  webhook-url: ${WECOM_WEBHOOK_URL:}
  timeout-ms: ${WECOM_TIMEOUT_MS:10000}

festival:
  calendar-url: ${FESTIVAL_CALENDAR_URL:https://ical.muhan.org}
  timeout-ms: ${FESTIVAL_TIMEOUT_MS:10000}

amap:
  key: ${AMAP_KEY:000cc2385ce54d5818f908d4b2a06d9a}
  city: ${AMAP_CITY:310000}
  timeout-ms: ${AMAP_TIMEOUT_MS:10000}

logging:
  level:
    com.example.notice: INFO
